name: تحديث لقطة المحتوى للزواحف الآلية + صفحات العروض

# يشتغل تلقائياً كل يوم الساعة 3 فجراً بتوقيت السعودية (00:00 UTC)، وأيضاً
# يدوياً من تبويب Actions بلوحة GitHub لو احتجت تحديث فوري (اضغط
# "Run workflow"). صفر أثر على أي زائر عادي بالموقع — بس يحدّث المحتوى
# النصي المخصَّص للزواحف الآلية (scripts/generate-snapshot.js) وصفحات
# meta المستقلة لكل عرض عقاري (scripts/generate-offer-pages.js، أُضيفت
# 2026-09-23 — المستوى الثاني من إصلاح السيو).
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  # 2026-09-26: تشغيل فوري عند أي تعديل على index.html أو الكود أو السكربتات،
  # عشان النسخ المولَّدة (صفحات الأقسام + العروض) ما تبقى على نسخة قديمة
  # لين الساعة ٣ فجراً. آمن من الحلقة اللانهائية: تعديلات هذا الـAction نفسه
  # (بـGITHUB_TOKEN) ما تطلق أي workflow جديد — قاعدة GitHub الثابتة.
  # push على main فقط (مو pull_request) — يتطلب صلاحية كتابة على المستودع أصلاً.
  push:
    branches: [main]
    paths:
      - "index.html"
      - "js/**"
      - "css/**"
      - "scripts/**"
      - ".github/workflows/generate-snapshot.yml"

# تشغيل واحد بس بنفس الوقت (المجدول + الفوري ما يتصادمون بالدفع) — اللاحق
# ينتظر السابق يخلص بدل ما يلغيه.
concurrency:
  group: generate-snapshot
  cancel-in-progress: false

# صلاحية الكتابة على المستودع لازمة عشان يقدر يحفظ الملفات المحدَّثة —
# هذي صلاحية GITHUB_TOKEN المدمجة تلقائياً بكل مستودع (تنتهي فور انتهاء
# التشغيل، بدون أي سرّ إضافي يُحفظ أو يُدار يدوياً).
permissions:
  contents: write

jobs:
  update-snapshot:
    runs-on: ubuntu-24.04
    steps:
      - name: سحب المستودع
        uses: actions/checkout@v6
        with:
          # التاريخ الكامل لازم لـ scripts/update-sitemap-lastmod.js (تاريخ آخر إيداع لكل صفحة)
          fetch-depth: 0

      - name: تجهيز Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: تشغيل سكربت توليد اللقطة
        run: node scripts/generate-snapshot.js

      - name: تشغيل سكربت توليد صفحات العروض
        run: node scripts/generate-offer-pages.js

      # 2026-09-26: صفحات الأقسام التسعة — لازم بعد سكربت اللقطة (يعدّل
      # index.html نفسه) عشان النسخ تكون من آخر نسخة. لو فشل، الـAction كله
      # يتوقف قبل الحفظ (صفر ملفات ناقصة تنشر).
      - name: تشغيل سكربت توليد صفحات الأقسام
        run: node scripts/generate-section-pages.js

      # 2026-10-02: صفحات الأحياء (/أحياء/...) + sitemap-districts.xml — تقرأ Supabase بمفتاح anon
      # (قراءة فقط). لو القاعدة رجّعت بيانات ناقصة يتوقف السكربت بدون كتابة/حذف أي ملف.
      - name: تشغيل سكربت توليد صفحات الأحياء
        run: node scripts/generate-district-pages.js

      # 2026-10-04: lastmod بـ sitemap.xml من تاريخ آخر إيداع حقيقي لكل صفحة (بدون إيداعات البوت).
      # لو تعذّر التاريخ تبقى القيمة الحالية ولا يفشل التشغيل.
      - name: تحديث lastmod لخريطة الموقع الرئيسية
        run: node scripts/update-sitemap-lastmod.js

      - name: حفظ التحديث (لو فيه تغيير فعلي بس)
        run: |
          git config user.name "himmat-snapshot-bot"
          git config user.email "actions@github.com"
          git add index.html offer/ sitemap.xml sitemap-offers.xml "أحياء/" sitemap-districts.xml offers.html valuation.html contracts.html add-property.html services.html about.html contact.html faq.html analytics.html
          if git diff --cached --quiet; then
            echo "لا تغيير بالبيانات — تخطي الحفظ."
          else
            git commit -m "🤖 تحديث تلقائي: لقطة المحتوى + صفحات العروض والأحياء"
            # لو انضاف كوميت على main أثناء التشغيل، نركّب فوقه بدل ما يفشل الدفع
            git pull --rebase origin main
            git push
          fi
