name: طلبات الوسوم وحذف الفروع (عبر فروع طلب)

# أُضيف 2026-10-14 وطُوِّر بنفس اليوم. جلسة Claude السحابية تمر بوسيط يسمح فقط
# برفع/تحديث الفروع: يرفض رفع الوسوم وحذف الفروع. فـClaude يرفع «فرع طلب» من
# آخر main (لازم يحتوي هذا الملف — GitHub يشغّل الـworkflow من الحفظ المرفوع)،
# وهذا الـAction (على خوادم GitHub) ينفّذ الطلب ثم يحذف فرع الطلب.
#
#   tag-request/<اسم-الوسم>             ← وسم على نفس الحفظ المرفوع
#   tag-request/<sha>/<اسم-الوسم>       ← وسم على حفظ محدد (لحفظ قديم لا يحتوي الملف)
#   delete-request/<اسم-الفرع>          ← حذف فرع واحد
#   delete-request/all-tagged           ← حذف كل فرع عليه وسم
#
# حمايات: اسم الوسم بنمط backup-YYYY-MM-DD-وصف ولا يُكتب فوق وسم موجود.
# الحذف: لا يُحذف أبداً main أو ci-logs، ولا يُحذف أي فرع إلا إذا كان حفظه
# الأخير محفوظاً بوسم (فلا يضيع أي حفظ). الوسوم نفسها لا تُحذف من هنا إطلاقاً.
# الصلاحية من GITHUB_TOKEN المؤقت (تنتهي مع التشغيل).
on:
  push:
    branches:
      - "tag-request/**"
      - "delete-request/**"

concurrency:
  group: ref-requests
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  handle-request:
    runs-on: ubuntu-latest
    steps:
      - name: تنفيذ الطلب وحذف فرع الطلب
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          PROTECTED_RE='^(main|ci-logs)$'

          delete_branch() {  # يحذف فرعاً بالـAPI؛ 404/422 = محذوف أصلاً
            gh api -X DELETE "repos/$REPO/git/refs/heads/$1" >/dev/null 2>&1 \
              && echo "🧹 حُذف الفرع $1" || echo "ℹ️ الفرع $1 غير موجود (ربما حُذف)"
          }
          tagged_commits() {  # كل الحفظات المشار لها بوسوم (خفيفة ومشروحة)
            git ls-remote --tags "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" | awk '{print $1}' | sort -u
          }

          case "$REF" in
            tag-request/*)
              REST="${REF#tag-request/}"
              if [[ "$REST" == */* ]]; then
                TARGET="${REST%%/*}"; TAG="${REST#*/}"
                if ! [[ "$TARGET" =~ ^[0-9a-f]{7,40}$ ]]; then
                  echo "::error::معرّف الحفظ غير صحيح: $TARGET"; delete_branch "$REF"; exit 1
                fi
                FULL=$(gh api "repos/$REPO/commits/$TARGET" -q .sha) || { echo "::error::الحفظ غير موجود: $TARGET"; delete_branch "$REF"; exit 1; }
              else
                TAG="$REST"; FULL="$SHA"
              fi
              if ! [[ "$TAG" =~ ^backup-[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9][a-z0-9-]*$ ]]; then
                echo "::error::اسم الوسم غير مسموح: $TAG"; delete_branch "$REF"; exit 1
              fi
              if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
                echo "::error::الوسم موجود أصلاً: $TAG — لا يُكتب فوقه"; delete_branch "$REF"; exit 1
              fi
              gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$FULL" >/dev/null
              echo "✅ أُنشئ الوسم $TAG على $FULL"
              delete_branch "$REF"
              ;;

            delete-request/*)
              WHAT="${REF#delete-request/}"
              TAGGED=$(tagged_commits)
              if [ "$WHAT" = "all-tagged" ]; then
                CANDIDATES=$(gh api --paginate "repos/$REPO/git/matching-refs/heads/" -q '.[] | .ref + " " + .object.sha' | sed 's#^refs/heads/##')
              else
                S=$(gh api "repos/$REPO/git/ref/heads/$WHAT" -q .object.sha 2>/dev/null) || { echo "::error::الفرع غير موجود: $WHAT"; delete_branch "$REF"; exit 1; }
                CANDIDATES="$WHAT $S"
              fi
              KEPT=0; DELETED=0
              while read -r BR BSHA; do
                [ -z "$BR" ] && continue
                if [[ "$BR" =~ $PROTECTED_RE ]] || [ "$BR" = "$REF" ]; then continue; fi
                if grep -qx "$BSHA" <<< "$TAGGED"; then
                  delete_branch "$BR"; DELETED=$((DELETED+1))
                else
                  echo "🛡️ أُبقي $BR — حفظه $BSHA غير محفوظ بأي وسم"; KEPT=$((KEPT+1))
                fi
              done <<< "$CANDIDATES"
              echo "النتيجة: حُذف $DELETED، أُبقي $KEPT"
              delete_branch "$REF"
              ;;
          esac
